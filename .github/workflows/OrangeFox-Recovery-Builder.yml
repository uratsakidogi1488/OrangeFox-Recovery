name: OrangeFox - Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Cleanup Space
      run: |
        sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /opt/ghc
        sudo apt clean

    - name: Install Build Tools
      run: |
        sudo apt update
        sudo apt install -y bc build-essential git-core gnupg gperf libsdl1.2-dev squashfs-tools zip curl libncurses5-dev zlib1g-dev openjdk-8-jdk gcc-multilib g++-multilib x11proto-core-dev libx11-dev libgl1-mesa-dev libxml2-utils xsltproc unzip python3 python-is-python3

    - name: Install Repo
      run: |
        mkdir ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Test GitLab Connectivity
      run: |
         echo "=== Проверка DNS ==="
         nslookup gitlab.com || true
    
         echo "=== Проверка ping ==="
         ping -c 2 gitlab.com || true
    
         echo "=== Проверка HTTPS ==="
         curl -v https://gitlab.com 2>&1 | head -20
    
         echo "=== Проверка доступности проекта ==="
         curl -s https://gitlab.com/api/v4/projects/OrangeFox%2Frecovery | head -20
    
    - name: Sync OrangeFox Sources
      run: |
        # 1. Полная чистка и создание структуры папок
        rm -rf ~/fox
        mkdir -p ~/fox/bootable/recovery
        mkdir -p ~/fox/vendor/recovery
        cd ~/fox
        
        # 2. Настройка авторизации через твой GITHUB_TOKEN
        # Это заставит систему использовать твой "паспорт" для всех скачиваний с GitHub
        git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
        
        # 3. Клонируем базу OrangeFox
        echo "Cloning Recovery Base..."
        git clone --depth=1 https://github.com/OrangeFoxRecovery/recovery.git -b fox_11.0 bootable/recovery
        
        # 4. Клонируем вендора (GitLab обычно пускает без проблем)
        echo "Cloning Vendor..."
        git clone --depth=1 https://gitlab.com/OrangeFox/vendor.git -b fox_11.0 vendor/recovery
        
        # 5. Проверка, что папки не пустые
        ls -A bootable/recovery


    - name: Clone Device Tree
      run: |
        git clone https://github.com/uratsakidogi1488/android_device_wheatek_WP15 ~/fox/device/wheatek/WP15
        
  
    - name: Create Config File
      run: |
        cd ~/fox/device/wheatek/WP15
        echo "def check_config(config):" > fox.config.py
        echo "    config['FOX_VERSION'] = 'R11.1'" >> fox.config.py
        echo "    config['FOX_BUILD_TYPE'] = 'Unofficial'" >> fox.config.py
        
    - name: Build OrangeFox
      run: |
        cd ~/fox
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL=C
        lunch omni_WP15-eng
        mka recoveryimage -j$(nproc --all)

    - name: Upload Result
      uses: actions/upload-artifact@v4
      with:
        name: OrangeFox-WP15
        path: ~/fox/out/target/product/WP15/*.img
        
