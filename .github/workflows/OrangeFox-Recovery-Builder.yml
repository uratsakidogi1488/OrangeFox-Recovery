name: OrangeFox - Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Cleanup Space
      run: |
        sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /opt/ghc
        sudo apt clean

    - name: Install Build Tools
      run: |
        sudo apt update
        sudo apt install -y bc build-essential git-core gnupg gperf libsdl1.2-dev squashfs-tools zip curl libncurses5-dev zlib1g-dev openjdk-8-jdk gcc-multilib g++-multilib x11proto-core-dev libx11-dev libgl1-mesa-dev libxml2-utils xsltproc unzip python3 python-is-python3

    - name: Install Repo
      run: |
        mkdir ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Test GitLab Connectivity
      run: |
         echo "=== Проверка DNS ==="
         nslookup gitlab.com || true
    
         echo "=== Проверка ping ==="
         ping -c 2 gitlab.com || true
    
         echo "=== Проверка HTTPS ==="
         curl -v https://gitlab.com 2>&1 | head -20
    
         echo "=== Проверка доступности проекта ==="
         curl -s https://gitlab.com/api/v4/projects/OrangeFox%2Frecovery | head -20
  
    - name: Sync Sources (TWRP Base + OrangeFox)
      run: |
        rm -rf ~/fox ~/sync
        mkdir -p ~/fox
        cd ~/fox
        
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        
        echo "=== 1. Качаем стабильную базу инструментов (TWRP 11) ==="
        repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-11 --depth=1
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags
        
        echo "=== 2. Вырезаем стандартный TWRP ==="
        rm -rf bootable/recovery
        
        echo "=== 3. Внедряем твои рабочие исходники OrangeFox 11.0 ==="
        git clone --depth=1 https://gitlab.com/OrangeFox/bootable/Recovery.git -b fox_11.0 bootable/recovery
        git clone --depth=1 https://gitlab.com/OrangeFox/vendor/recovery.git -b fox_11.0 vendor/recovery

    - name: Clone Device Tree
      run: |
        git clone https://github.com/uratsakidogi1488/android_device_wheatek_WP15 ~/fox/device/wheatek/WP15
        
  
    - name: Create Config File
      run: |
        cd ~/fox/device/wheatek/WP15
        echo "def check_config(config):" > fox.config.py
        echo "    config['FOX_VERSION'] = 'R11.1'" >> fox.config.py
        echo "    config['FOX_BUILD_TYPE'] = 'Unofficial'" >> fox.config.py

    - name: Patch Device Tree
      run: |
        cd ~/fox/device/wheatek/WP15
        
        # 1. Исправляем vendorsetup.sh (удаляем старую команду)
        sed -i '/add_lunch_combo/d' vendorsetup.sh
        
        # 2. Создаем AndroidProducts.mk (новый стандарт для lunch)
        echo "PRODUCT_MAKEFILES := \$(LOCAL_DIR)/omni_WP15.mk" > AndroidProducts.mk
        echo "COMMON_LUNCH_CHOICES := omni_WP15-eng" >> AndroidProducts.mk
        
        # 3. Убираем старый флаг из device.mk
        sed -i 's/PRODUCT_STATIC_BOOT_CONTROL_HAL := true/# PRODUCT_STATIC_BOOT_CONTROL_HAL := true/' device.mk
        
        echo "=== Дерево устройства пропатчено под Android 11 ==="
        
    - name: Build OrangeFox
      run: |
        cd ~/fox
        source build/envsetup.sh
        
        # Теперь lunch должен сработать, так как мы создали AndroidProducts.mk
        lunch omni_WP15-eng || (echo "Lunch провалился, пробуем прямой выбор" && export TARGET_DEVICE=WP15)
        
        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL=C
        
        # Запускаем сборку
        mka recoveryimage -j$(nproc --all)


    - name: Upload Result
      uses: actions/upload-artifact@v4
      with:
        name: OrangeFox-WP15
        path: ~/fox/out/target/product/WP15/*.img
        
